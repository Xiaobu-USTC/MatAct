[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "matact"
version = "1.0.0"
description = "MatAct: learning reliable and cost-aware scientific tool use from executable experience"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.22"]
train = ["torch>=2.4", "transformers>=4.51", "accelerate>=0.34", "deepspeed>=0.14"]
rl = ["verl", "pandas", "pyarrow"]

[tool.setuptools.packages.find]
include = ["matact*"]
