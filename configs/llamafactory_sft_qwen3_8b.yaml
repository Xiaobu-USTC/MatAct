# Standard (uniform-weight) SFT baseline with LLaMA-Factory on the MatAct cold-start set.
#   llamafactory-cli train configs/llamafactory_sft_qwen3_8b.yaml
# Hyperparameters follow Supplementary Table 6. Action-weighted SFT (the MatAct
# objective) is not available in LLaMA-Factory; use scripts/train_awsft.sh for it.

### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: configs/ds_zero3.json

### dataset
dataset: matact_sft
dataset_dir: data/sft
template: qwen3_nothink
cutoff_len: 4900
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: outputs/qwen3-8b-sft-uniform
logging_steps: 10
save_strategy: epoch
plot_loss: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
bf16: true
seed: 42
